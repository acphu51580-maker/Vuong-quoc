<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Taming.io Clone - Sinh Tồn</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #111; touch-action: none; }
        canvas { display: block; background: #4a7c59; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
        
        /* Bảng thông tin góc trái */
        #player-info {
            position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6);
            padding: 10px; border-radius: 8px; border: 2px solid #fff; color: white; width: 180px;
            font-size: 14px;
        }
        .name-lv { font-weight: bold; font-size: 16px; display: flex; justify-content: space-between; margin-bottom: 5px;}
        .bar-bg { background: #333; height: 10px; border-radius: 5px; margin-top: 5px; overflow: hidden; }
        .bar-hp { background: #ff3333; height: 100%; width: 100%; transition: width 0.2s; }
        .bar-xp { background: #00ccff; height: 100%; width: 0%; transition: width 0.2s; }
        .res-text { margin-top: 8px; font-size: 12px; color: #ddd; display: flex; flex-direction: column; gap: 3px;}
        .res-text span { color: #fff; font-weight: bold; }

        /* Joystick */
        #joystick-zone { position: absolute; bottom: 20px; left: 20px; width: 120px; height: 120px; pointer-events: auto; }
        #joystick-base { width: 100%; height: 100%; background: rgba(255,255,255,0.2); border-radius: 50%; border: 2px solid rgba(255,255,255,0.5); position: relative;}
        #joystick-stick { width: 50px; height: 50px; background: rgba(255,255,255,0.7); border-radius: 50%; position: absolute; top: 35px; left: 35px; }

        /* Nút bấm */
        #action-buttons { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; pointer-events: auto; align-items: flex-end;}
        .btn { width: 70px; height: 70px; border-radius: 50%; background: rgba(255, 50, 50, 0.7); border: 2px solid #fff; color: white; font-weight: bold; font-size: 14px; display: flex; align-items: center; justify-content: center; text-align: center;}
        .btn:active { transform: scale(0.9); background: rgba(255, 50, 50, 1); }
        .btn-small { width: 60px; height: 60px; background: rgba(50, 150, 255, 0.7); font-size: 12px;}
        .btn-small:active { background: rgba(50, 150, 255, 1); }

        /* Sảnh chờ (Login) */
        #login-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1e3c72, #2a5298); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;
        }
        .login-box { background: rgba(0,0,0,0.5); padding: 30px; border-radius: 15px; border: 1px solid #ffd700; text-align: center; width: 80%; max-width: 400px; }
        .login-box h1 { margin-bottom: 20px; color: #ffd700; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: none; font-size: 16px; text-align: center;}
        .btn-login { width: 100%; padding: 15px; background: #ffd700; color: #000; border: none; border-radius: 5px; font-weight: bold; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h1>TAMING.IO CLONE</h1>
            <input type="text" id="username" placeholder="Nhập tên của bạn..." value="Thợ Săn">
            <button class="btn-login" onclick="startGame()">BẮT ĐẦU SINH TỒN</button>
            <p style="margin-top: 15px; font-size: 12px; color: #aaa;">Chặt cây, đập đá, thuần hóa thú!</p>
        </div>
    </div>

    <div id="ui-layer">
        <div id="player-info">
            <div class="name-lv"><span id="ui-name">Tên</span> <span>Lv.<span id="ui-lv">1</span></span></div>
            <div class="bar-bg"><div class="bar-hp" id="ui-hp-bar"></div></div>
            <div class="bar-bg"><div class="bar-xp" id="ui-xp-bar"></div></div>
            <div class="res-text">
                <div>🪵 Gỗ: <span id="ui-wood">0</span></div>
                <div>🪨 Đá: <span id="ui-stone">0</span></div>
                <div>🪙 Vàng: <span id="ui-gold">0</span></div>
            </div>
        </div>

        <div id="joystick-zone">
            <div id="joystick-base"><div id="joystick-stick"></div></div>
        </div>

        <div id="action-buttons">
            <button class="btn btn-small" onclick="tamePet()">Thuần Hóa</button>
            <button class="btn btn-small" onclick="buildWall()">Xây Nhà</button>
            <button class="btn" onclick="attack()">CHÉM</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // --- CẤU HÌNH ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        let player = { name: "Hunter", x: 0, y: 0, hp: 100, maxHp: 100, wood: 0, stone: 0, gold: 0, level: 1, xp: 0, xpMax: 20 };
        let joystick = { active: false, dx: 0, dy: 0 };
        let facing = { x: 0, y: 1 };
        let attackCooldown = 0;

        // --- THẾ GIỚI ---
        let trees = [];
        let rocks = [];
        let animals = [];
        let walls = [];
        let slashes = [];

        // --- KHỞI TẠO THẾ GIỚI ---
        function initWorld() {
            trees = []; rocks = []; animals = []; walls = [];
            for (let i = 0; i < 30; i++) trees.push({ x: (Math.random() - 0.5) * 2000, y: (Math.random() - 0.5) * 2000, radius: 25, hp: 3 });
            for (let i = 0; i < 20; i++) rocks.push({ x: (Math.random() - 0.5) * 2000, y: (Math.random() - 0.5) * 2000, radius: 20, hp: 5 });
            for (let i = 0; i < 10; i++) animals.push({ 
                x: (Math.random() - 0.5) * 1000, y: (Math.random() - 0.5) * 1000, 
                radius: 15, type: ['Sói', 'Gấu', 'Thỏ'][Math.floor(Math.random()*3)], 
                tamed: false, hp: 50, maxHp: 50, color: '#8B4513'
            });
        }

        function startGame() {
            player.name = document.getElementById('username').value || "Hunter";
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('ui-layer').style.display = 'block';
            initWorld();
            updateUI();
            gameLoop();
        }

        // --- ĐIỀU KHIỂN JOYSTICK ---
        const joyZone = document.getElementById('joystick-zone');
        const joyStick = document.getElementById('joystick-stick');
        const joyBase = document.getElementById('joystick-base');

        joyZone.addEventListener('touchstart', (e) => { e.preventDefault(); joystick.active = true; });
        joyZone.addEventListener('touchmove', (e) => {
            if (!joystick.active) return;
            e.preventDefault();
            let touch = e.touches[0];
            let rect = joyBase.getBoundingClientRect();
            let dx = touch.clientX - (rect.left + rect.width/2);
            let dy = touch.clientY - (rect.top + rect.height/2);
            let dist = Math.hypot(dx, dy);
            let max = rect.width / 2;
            if (dist > max) { dx = (dx/dist)*max; dy = (dy/dist)*max; }
            joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
            joystick.dx = dx / max; joystick.dy = dy / max;
        });
        joyZone.addEventListener('touchend', () => { joystick.active = false; joystick.dx = 0; joystick.dy = 0; joyStick.style.transform = `translate(0,0)`; });
        
        // Hỗ trợ chuột cho PC
        joyZone.addEventListener('mousedown', () => joystick.active = true);
        window.addEventListener('mousemove', (e) => {
            if (!joystick.active) return;
            let rect = joyBase.getBoundingClientRect();
            let dx = e.clientX - (rect.left + rect.width/2);
            let dy = e.clientY - (rect.top + rect.height/2);
            let dist = Math.hypot(dx, dy);
            let max = rect.width / 2;
            if (dist > max) { dx = (dx/dist)*max; dy = (dy/dist)*max; }
            joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
            joystick.dx = dx / max; joystick.dy = dy / max;
        });
        window.addEventListener('mouseup', () => { joystick.active = false; joystick.dx = 0; joystick.dy = 0; joyStick.style.transform = `translate(0,0)`; });

        // --- HÀNH ĐỘNG ---
        function attack() {
            if (attackCooldown > 0) return;
            attackCooldown = 15;
            slashes.push({ x: player.x + facing.x * 40, y: player.y + facing.y * 40, life: 10 });

            // Chém cây
            trees.forEach((t, i) => {
                if (Math.hypot(player.x - t.x, player.y - t.y) < 60) {
                    t.hp--; if (t.hp <= 0) { player.wood += 5; trees.splice(i, 1); addXP(2); }
                }
            });
            // Chém đá
            rocks.forEach((r, i) => {
                if (Math.hypot(player.x - r.x, player.y - r.y) < 60) {
                    r.hp--; if (r.hp <= 0) { player.stone += 5; rocks.splice(i, 1); addXP(3); }
                }
            });
            // Chém quái
            animals.forEach(a => {
                if (!a.tamed && Math.hypot(player.x - a.x, player.y - a.y) < 60) {
                    a.hp -= 20; if (a.hp <= 0) { player.gold += 10; addXP(5); a.x = 9999; a.y = 9999; } // Biến mất
                }
            });
            updateUI();
        }

        function tamePet() {
            animals.forEach(a => {
                if (!a.tamed && Math.hypot(player.x - a.x, player.y - a.y) < 100) {
                    a.tamed = true;
                    a.name = "Pet " + a.type;
                    a.color = '#00ccff'; // Đổi màu khi thuần hóa
                }
            });
        }

        function buildWall() {
            if (player.wood >= 10 && player.stone >= 5) {
                player.wood -= 10; player.stone -= 5;
                walls.push({ x: player.x + facing.x * 50, y: player.y + facing.y * 50, radius: 30 });
                updateUI();
            } else {
                alert("Cần 10 Gỗ và 5 Đá để xây!");
            }
        }

        function addXP(amount) {
            player.xp += amount;
            if (player.xp >= player.xpMax) {
                player.level++; player.xp -= player.xpMax; player.xpMax = Math.floor(player.xpMax * 1.5);
                player.maxHp += 20; player.hp = player.maxHp;
            }
        }

        // --- VÒNG LẶP GAME ---
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function update() {
            if (attackCooldown > 0) attackCooldown--;

            // Di chuyển
            if (joystick.active) {
                player.x += joystick.dx * 6;
                player.y += joystick.dy * 6;
                facing.x = joystick.dx; facing.y = joystick.dy;
            }

            // Thú cưng đi theo
            animals.forEach(a => {
                if (a.tamed) {
                    let dx = player.x - a.x; let dy = player.y - a.y;
                    let dist = Math.hypot(dx, dy);
                    if (dist > 60) { a.x += (dx/dist)*5; a.y += (dy/dist)*5; }
                } else {
                    // Thú hoang đi lòng vòng
                    a.x += (Math.random() - 0.5) * 2;
                    a.y += (Math.random() - 0.5) * 2;
                }
            });

            // Hiệu ứng chém
            slashes.forEach((s, i) => { s.life--; if (s.life <= 0) slashes.splice(i, 1); });
        }

        function draw() {
            ctx.fillStyle = '#4a7c59'; // Nền cỏ
            ctx.fillRect(0, 0, width, height);

            let camX = width/2 - player.x;
            let camY = height/2 - player.y;

            // Vẽ Cây
            trees.forEach(t => {
                ctx.fillStyle = '#654321'; ctx.beginPath(); ctx.arc(t.x + camX, t.y + camY, t.radius, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#2E8B57'; ctx.beginPath(); ctx.arc(t.x + camX, t.y + camY - 10, t.radius + 5, 0, Math.PI*2); ctx.fill();
            });

            // Vẽ Đá
            rocks.forEach(r => {
                ctx.fillStyle = '#808080'; ctx.beginPath(); ctx.arc(r.x + camX, r.y + camY, r.radius, 0, Math.PI*2); ctx.fill();
            });

            // Vẽ Tường
            walls.forEach(w => {
                ctx.fillStyle = '#8B4513'; ctx.fillRect(w.x + camX - 25, w.y + camY - 25, 50, 50);
                ctx.strokeStyle = '#000'; ctx.strokeRect(w.x + camX - 25, w.y + camY - 25, 50, 50);
            });

            // Vẽ Thú
            animals.forEach(a => {
                ctx.beginPath(); ctx.arc(a.x + camX, a.y + camY, a.radius, 0, Math.PI*2);
                ctx.fillStyle = a.color; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.stroke();
                
                if (a.tamed) {
                    ctx.fillStyle = '#00ccff'; ctx.font = '10px Arial'; ctx.textAlign = 'center';
                    ctx.fillText(a.name, a.x + camX, a.y + camY - 20);
                }
            });

            // Vẽ Người chơi
            ctx.beginPath(); ctx.arc(player.x + camX, player.y + camY, 20, 0, Math.PI*2);
            ctx.fillStyle = '#ffcc00'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
            
            // Hướng nhìn
            ctx.beginPath(); ctx.moveTo(player.x + camX, player.y + camY);
            ctx.lineTo(player.x + camX + facing.x * 30, player.y + camY + facing.y * 30);
            ctx.strokeStyle = 'red'; ctx.lineWidth = 4; ctx.stroke();

            // Tên
            ctx.fillStyle = 'white'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
            ctx.fillText(player.name, player.x + camX, player.y + camY - 30);

            // Hiệu ứng chém
            slashes.forEach(s => {
                ctx.beginPath(); ctx.arc(s.x + camX, s.y + camY, 30, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)'; ctx.fill();
            });
        }

        function updateUI() {
            document.getElementById('ui-name').innerText = player.name;
            document.getElementById('ui-lv').innerText = player.level;
            document.getElementById('ui-hp-bar').style.width = (player.hp / player.maxHp * 100) + '%';
            document.getElementById('ui-xp-bar').style.width = (player.xp / player.xpMax * 100) + '%';
            document.getElementById('ui-wood').innerText = player.wood;
            document.getElementById('ui-stone').innerText = player.stone;
            document.getElementById('ui-gold').innerText = player.gold;
        }
    </script>
</body>
</html>
